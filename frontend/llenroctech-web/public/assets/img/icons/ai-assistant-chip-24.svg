<?xml version="1.0" encoding="UTF-8"?>
<!-- Simple AI chip with 'A' stroke mark; very clear at small sizes -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
     fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <title>AI Chip</title>
  <desc>Monoline chip icon optimized for 16–24px, uses currentColor.</desc>
  <!-- chip body -->
  <rect x="5" y="6.5" width="14" height="11" rx="2.2"/>
  <!-- pins -->
  <path d="M8 4v2M12 4v2M16 4v2M8 17.5v2M12 17.5v2M16 17.5v2M4 9h2M4 13h2M18 9h2M18 13h2"/>
  <!-- stylized A -->
  <path d="M11 15l1.2-3.8 1.2 3.8M11.6 13.7h1.6"/>
</svg>
