<?xml version="1.0" encoding="UTF-8"?>
<!-- Clean small-size AI icon: robot head inside rounded square, monoline -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
     fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <title>AI Assistant</title>
  <desc>Monoline robot head icon optimized for 16–24px, matches outline set.</desc>
  <!-- container / badge -->
  <rect x="3.5" y="3.5" width="17" height="17" rx="4"/>
  <!-- antenna -->
  <path d="M12 5v2"/>
  <circle cx="12" cy="4" r="1"/>
  <!-- head -->
  <rect x="7.5" y="9" width="9" height="6.5" rx="3"/>
  <!-- eyes -->
  <circle cx="10.5" cy="12" r="0.8"/>
  <circle cx="13.5" cy="12" r="0.8"/>
  <!-- mouth -->
  <path d="M10 14h4"/>
</svg>
