<section class="skill-section-area">
  <div class="container">
    <div class="skill-header heading1">
      <h5 data-aos="fade-left" data-aos-duration="800">
        <img src="assets/img/icons/yellow_circle_icon.svg" alt="">
        Core Technologies
      </h5>
      <div class="space24"></div>
      <h2 data-aos="fade-left" data-aos-duration="1000">Enterprise</h2>
      <div class="space24"></div>
      <h2 class="head" data-aos="fade-left" data-aos-duration="1100">
        Technology <span>Stack</span>
      </h2>
    </div>

    <div class="space50"></div>

    <div class="technology-groups">
      <section class="technology-group"
               *ngFor="let group of technologyGroups; let i = index"
               data-aos="fade-up"
               [attr.data-aos-duration]="800 + (i * 100)">
        <header class="group-header">
          <div class="group-icon" aria-hidden="true">
            <i [class]="group.icon"></i>
          </div>
          <div>
            <h3>{{ group.title }}</h3>
            <p>{{ group.description }}</p>
          </div>
        </header>

        <div class="technology-list">
          <span class="technology-item"
                *ngFor="let technology of group.technologies">{{ technology }}</span>
        </div>
      </section>
    </div>
  </div>
</section>
