<div class="forms-page">
  <video class="forms-water-background"
         [muted]="true"
         [autoplay]="true"
         [loop]="true"
         playsinline
         preload="auto"
         aria-hidden="true">
    <source src="assets/img/video/video1.mp4" type="video/mp4">
  </video>

<!-- ===== FORMS (styled like Contact) ===== -->
<main class="contact-section-area" data-aos="fade-left" data-aos-duration="900">
  <div class="container">
    <div class="row">
      <div class="col-lg-12">

        <!-- Header -->
        <div class="contact-heading heading1" *ngIf="showSectionHeader !== false">
          <h5><img src="assets/img/icons/yellow_circle_icon.svg" alt="">Forms</h5>
          <div class="space24"></div>
          <h2>Partnership & Intake Portal</h2>
          <div class="space24"></div>
          <h2 class="head">Clients <span>•</span> Consultants <span>•</span> C2C Opportunities</h2>
        </div>

        <div class="space50"></div>

        <!-- Card -->
        <div class="contact-boxarea forms-compact" data-aos="zoom-in" data-aos-duration="1000">
          <h3>{{ heading || 'Available Forms' }}</h3>
          <div class="space12"></div>

          <!-- Public -->
          <div class="row row-cols-1 row-cols-md-2 g-3 form-button-row">

            <div class="col">
              <a class="vl-btn1 btn-full d-flex w-100 justify-content-between align-items-center"
                 href="https://forms.office.com/Pages/ResponsePage.aspx?id=XMyOlFLWg0SZ0VoLGWT8r85gfgwYVpRMtqWtHwIsEUBURDFSMDhNVEVHVjFTWUM1UlFVNjg1WlIzUiQlQCN0PWcu"
                 target="_blank"
                 rel="noopener noreferrer">
                <span class="label">Talent Network form</span>
                <img class="icon-form" src="assets/img/icons/form.svg" alt="" aria-hidden="true"
                     width="18" height="18" style="width:18px;height:18px;flex:0 0 18px;" />
              </a>
            </div>

            <div class="col">
              <a class="vl-btn1 btn-full d-flex w-100 justify-content-between align-items-center"
                 href="https://forms.office.com/Pages/ResponsePage.aspx?id=XMyOlFLWg0SZ0VoLGWT8r_j0A8qUhJNFifJhkhK5tu1UM0dEUFI0SFNRMjEyNEpDTTVQTDlUUkc4Wi4u"
                 target="_blank"
                 rel="noopener noreferrer">
                <span class="label">Client Staffing Request</span>
                <img class="icon-form" src="assets/img/icons/form.svg" alt="" aria-hidden="true"
                     width="18" height="18" style="width:18px;height:18px;flex:0 0 18px;" />
              </a>
            </div>

            <div class="col">
              <a class="vl-btn1 btn-full d-flex w-100 justify-content-between align-items-center"
                 [routerLink]="['/forms/dsr-request']">
                <span class="label">Right-to-Represent Request</span>
                <img class="icon-form" src="assets/img/icons/form.svg" alt="" aria-hidden="true"
                     width="18" height="18" style="width:18px;height:18px;flex:0 0 18px;" />
              </a>
            </div>

          </div>

          <div class="space24"></div>
        </div>

        <div class="space50"></div>
      </div>
    </div>
  </div>
</main>
<!-- ===== FORMS ENDS ===== -->
</div>
