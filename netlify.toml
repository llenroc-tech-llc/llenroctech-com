[functions]
node_bundler = "esbuild"

[build]
base      = "frontend/llenroctech-web"
command   = "npm ci --prefix ../.. && npm ci && npm run build"
publish   = "dist/llenroc-angular/browser"
functions = "../../netlify/functions"

[build.environment]
NODE_VERSION = "20"

[dev]
command       = "npm run start:netlify"
targetPort    = 4200
port          = 8888
functionsPort = 9991
autoLaunch    = true

# Functions proxy (keep for dev + prod)
[[redirects]]
  from = "/api/*"
  to   = "/.netlify/functions/:splat"
  status = 200

# --- Passthrough dev assets so they are NOT rewritten to /index.html
[[redirects]]
  from = "/@vite/*"
  to   = "/@vite/:splat"
  status = 200

[[redirects]]
  from = "/.angular/*"
  to   = "/.angular/:splat"
  status = 200

[[redirects]]
  from = "/src/*"
  to   = "/src/:splat"
  status = 200

# SPA fallback ONLY IN PRODUCTION
[context.production]
  [[redirects]]
    from = "/*"
    to   = "/index.html"
    status = 200
