<!--===== AI ASSISTANT AREA STARTS =======-->
<div id="ai-assistant"  class="contact-section-area" data-aos="fade-left" data-aos-duration="900">
  <div class="container">
    <div class="row">
      <div class="col-lg-12">

        <!-- heading block (mirrors contact-heading) -->
        <div class="contact-heading heading1">
          <h5><img src="assets/img/icons/yellow_circle_icon.svg" alt="">AI Assistant</h5>
          <div class="space24"></div>
          <h2>Ask about services, stack, pricing, or how to start</h2>
        </div>

        <div class="space50"></div>

        <!-- box area (mirrors contact-boxarea) -->
        <div class="contact-boxarea" data-aos="zoom-in" data-aos-duration="1000">
          <h3>Quick questions</h3>
          <div class="space12"></div>

          <!-- suggestion chips -->
          <div class="ai-suggests">
            <button type="button" class="chip" (click)="quick('What services do you offer?')">Services</button>
            <button type="button" class="chip" (click)="quick('Do you build Angular + Spring Boot apps?')">Stack</button>
            <button type="button" class="chip" (click)="quick('How do we start a project and what’s the timeline?')">Getting started</button>
          </div>

          <div class="space16"></div>

          <!-- chat log styled like inputs -->
          <div #log class="ai-chatlog" *ngIf="visMessages.length">
            <div *ngFor="let m of visMessages" class="ai-msg" [class.user]="m.role==='user'">
              {{ m.content }}
            </div>
          </div>

          <div class="space12"></div>

          <!-- input + button using your existing styles -->
          <form (submit)="$event.preventDefault(); send()" novalidate>
            <div class="input-area">
              <textarea
                rows="4"
                [(ngModel)]="q"
                name="question"
                placeholder="Type your question…"
                [disabled]="loading"
                aria-label="Ask the Llenroc Tech assistant">
              </textarea>
            </div>

            <div class="space16"></div>

            <div class="input-area">
              <button type="submit" class="vl-btn1"
                  [disabled]="loading || !q.trim()">
            Ask Now
          </button>
            </div>
          </form>
        </div>

        <div class="space50"></div>

      </div>
    </div>
  </div>
</div>
<!--===== AI ASSISTANT AREA ENDS =======-->
