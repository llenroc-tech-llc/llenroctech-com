<div class="portfolio-section-area">
  <div class="container">
    <div class="row">
      <div class="col-lg-12">
        <div class="portfolio-header heading1">
          <h5 data-aos="fade-left" data-aos-duration="800">
            <img src="assets/img/icons/yellow_circle_icon.svg" alt="">Website Templates
          </h5>
          <div class="space24"></div>
          <h2 data-aos="fade-left" data-aos-duration="1000">Angular Templates</h2>
          <div class="space24"></div>
          <h2 class="head" data-aos="fade-left" data-aos-duration="1100">Browse <span>ThemeForest</span></h2>
        </div>
      </div>
    </div>

    <div class="space24"></div>

    <!-- Search + Filters -->
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
      <!-- search box -->
      <div class="d-flex align-items-stretch gap-2" style="max-width: 520px; width: 100%;">
        <input
          #q
          class="form-control"
          style="flex:1; min-width: 220px;"
          placeholder="Search (e.g. angular admin ecommerce)"
          (input)="term.set(q.value)"
          (keyup.enter)="onSearch()">
        <button class="vl-btn1" (click)="onSearch()" [disabled]="loading()">Search</button>
      </div>

      <!-- filter pills -->
      <div class="d-flex flex-wrap gap-2">
        <button
          *ngFor="let k of filterOrder"
          class="vl-btn1"
          [class.active]="activeFilter()===k"
          (click)="applyFilter(k)">
          {{ filters[k].label }}
        </button>
      </div>
    </div>

    <div class="space24"></div>

    <div *ngIf="errorMsg()" class="alert alert-warning" role="alert">
      {{ errorMsg() }}
    </div>

    <!-- Grid -->
    <div class="row">
      <div class="col-lg-6 col-md-6"
           *ngFor="let t of items(); trackBy: trackById"
           data-aos="fade-left" data-aos-duration="1000">
        <div class="portfolio-boxarea click-here" (click)="selectAndOpen(t)">
          <div class="img1">
            <a href="javascript:void(0)">
              <img [src]="t.thumbnail || 'assets/img/all-images/portfolio/portfolio-img1.png'" alt="">
            </a>
          </div>
          <div class="space24"></div>
          <a href="javascript:void(0)">{{ t.name }}</a>
        </div>
      </div>
    </div>

    <div class="space24"></div>

    <!-- Pagination controls -->
    <div class="d-flex justify-content-center gap-3 align-items-center">
      <button class="vl-btn1" (click)="prevPage()" [disabled]="page()===1 || loading()">‹ Prev</button>
      <span>{{ page() }}</span>
      <button class="vl-btn1" (click)="nextPage()" [disabled]="loading() || !hasNext()">Next ›</button>
    </div>

    <div class="space12"></div>
    <div class="d-flex justify-content-center">
      <button class="vl-btn1" (click)="loadMore()" [disabled]="loading() || !hasNext()">Load more</button>
    </div>

    <div class="space24"></div>
  </div>
</div>
