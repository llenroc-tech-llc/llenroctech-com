<!-- ===== INITIAL INTAKE (public) ===== -->
<div class="contact-section-area" data-aos="fade-left" data-aos-duration="900">
  <div class="container">
    <div class="row">
      <div class="col-lg-12">

        <div class="contact-heading heading1" *ngIf="showSectionHeader">
          <h5><img src="assets/img/icons/yellow_circle_icon.svg" alt="">Initial Intake</h5>
          <div class="space24"></div>
          <h2>Have Any Project in</h2>
          <div class="space24"></div>
          <h2 class="head">Mind, <span>Share a Few Details</span></h2>
        </div>

        <div class="space50"></div>

        <div class="contact-boxarea" data-aos="zoom-in" data-aos-duration="1000">
          <h3>{{ heading }}</h3>
          <div class="space12"></div>

          <form
            [formGroup]="form"
            (ngSubmit)="onSubmit($event)"
            novalidate
            [attr.aria-busy]="submitting() ? 'true' : 'false'">

            <!-- Honeypot -->
            <p class="hidden" style="display:none" aria-hidden="true">
              <label>
                Don’t fill this out:
                <input name="bot-field" formControlName="botField" tabindex="-1" autocomplete="off" />
              </label>
            </p>

            <div class="row">
              <!-- ClientProject (required) -->
              <div class="col-lg-6 col-md-6">
                <div class="input-area">
                  <input
                    type="text"
                    name="clientProject"
                    placeholder="Client / Project Name *"
                    formControlName="clientProject"
                    [class.invalid]="isInvalid('clientProject')"
                    [attr.aria-invalid]="isInvalid('clientProject')"
                    required/>
                  <small *ngIf="isInvalid('clientProject')" class="error">Please enter at least 2 characters.</small>
                </div>
              </div>

              <!-- ContactEmail (required) -->
              <div class="col-lg-6 col-md-6">
                <div class="input-area">
                  <input
                    type="email"
                    name="contactEmail"
                    placeholder="Contact Email *"
                    formControlName="contactEmail"
                    [class.invalid]="isInvalid('contactEmail')"
                    [attr.aria-invalid]="isInvalid('contactEmail')"
                    required/>
                  <small *ngIf="isInvalid('contactEmail')" class="error">Enter a valid email.</small>
                </div>
              </div>

              <!-- Industry (choice) -->
              <div class="col-lg-6 col-md-6">
                <div class="input-area">
                  <select name="industry" formControlName="industry">
                    <option value="">Industry (optional)</option>
                    <option *ngFor="let opt of industries" [value]="opt">{{ opt }}</option>
                  </select>
                </div>
              </div>

              <!-- RetentionRange (choice) -->
              <div class="col-lg-6 col-md-6">
                <div class="input-area">
                  <select name="retentionRange" formControlName="retentionRange">
                    <option value="">Retention Range (optional)</option>
                    <option *ngFor="let opt of retentionRanges" [value]="opt">{{ opt }}</option>
                  </select>
                </div>
              </div>

              <!-- DataCollected (multi-select checkboxes) -->
              <div class="col-lg-12">
                <div class="input-area">
                  <label class="block mb-2">Data Collected (choose all that apply)</label>
                  <div class="d-flex flex-wrap gap-3">
                    <label *ngFor="let opt of dataCollectedOptions" class="checkbox">
                      <input type="checkbox" [value]="opt" (change)="toggleDataCollected(opt, $event)" [checked]="form.value.dataCollected?.includes(opt)" />
                      <span>{{ opt }}</span>
                    </label>
                  </div>
                </div>
              </div>

              <!-- Purposes (multiline, required) -->
              <div class="col-lg-12">
                <div class="input-area">
                  <textarea
                    name="purposes"
                    placeholder="Describe the purposes for collecting this data *"
                    rows="5"
                    formControlName="purposes"
                    [class.invalid]="isInvalid('purposes')"
                    [attr.aria-invalid]="isInvalid('purposes')"
                    required></textarea>
                  <small *ngIf="isInvalid('purposes')" class="error">Tell us a little more (min 10 chars).</small>
                </div>
              </div>

              <!-- StorageVendors (multiline) -->
              <div class="col-lg-12">
                <div class="input-area">
                  <textarea
                    name="storageVendors"
                    placeholder="Storage vendors / tools (optional)"
                    rows="3"
                    formControlName="storageVendors"></textarea>
                </div>
              </div>

              <!-- Submit -->
              <div class="col-lg-12">
                <div class="input-area">
                  <button type="submit" class="vl-btn1" [disabled]="submitting() || form.invalid">
                    {{ submitting() ? 'Submitting…' : 'Submit Now' }}
                    <img class="icon-form" src="assets/img/icons/form.svg" alt="" aria-hidden="true"
     width="18" height="18" style="width:18px;height:18px;flex:0 0 18px;" />
                  </button>
                </div>
              </div>
            </div>

            <div class="space16"></div>

            <!-- Success / Error toasts -->
            <div *ngIf="sent()" class="alert success" role="status" aria-live="polite">
              <span>Thanks! Your intake was received.</span>
              <button type="button" class="alert-close" (click)="dismiss('sent')" aria-label="Close">✕</button>
            </div>

            <div *ngIf="failed()" class="alert error" role="alert" aria-live="assertive">
              <span>Something went wrong. Please try again or email hello&#64;llenroctech.com.</span>
              <button type="button" class="alert-close" (click)="dismiss('failed')" aria-label="Close">✕</button>
            </div>
          </form>
        </div>

        <div class="space50"></div>

      </div>
    </div>
  </div>
</div>
