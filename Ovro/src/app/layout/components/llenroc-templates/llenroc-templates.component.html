<!-- src/app/sections/llenroc-templates/llenroc-templates.component.html -->
<div class="portfolio-section-area">
  <div class="container">
    <div class="row">
      <div class="col-lg-12">
        <div class="portfolio-header heading1">
          <h5 data-aos="fade-left" data-aos-duration="800">
            <img src="assets/img/icons/yellow_circle_icon.svg" alt=""> LLENROC Templates
          </h5>
          <div class="space24"></div>
          <h2 data-aos="fade-left" data-aos-duration="1000">{{ heading }}</h2>
          <div class="space24"></div>
          <!-- <h2 class="head" data-aos="fade-left" data-aos-duration="1100">{{ subheading }}</h2> -->
        </div>
      </div>
    </div>

    <div class="space24"></div>

    <div *ngIf="errorMsg" class="alert alert-warning" role="alert">{{ errorMsg }}</div>

    <!-- Grid (identical structure/classes to portfolio) -->
    <div class="row">
      <div class="col-lg-6 col-md-6"
           *ngFor="let t of items; trackBy: trackById"
           data-aos="fade-left" data-aos-duration="1000">
        <div class="portfolio-boxarea click-here" (click)="selectAndOpen(t)">
          <div class="img1">
            <a href="javascript:void(0)">
              <!-- IMAGE COMES DIRECTLY FROM JSON -->
              <img [src]="t.thumbnail || 'assets/img/all-images/portfolio/portfolio-img1.png'"
                   [alt]="t.name">
            </a>
          </div>
          <div class="space24"></div>
          <a href="javascript:void(0)">{{ t.name }}</a>

          <div class="space12" *ngIf="t.tags?.length"></div>
          <div class="d-flex flex-wrap gap-2" *ngIf="t.tags?.length">
            <span class="badge bg-light text-dark" *ngFor="let tag of t.tags">{{ tag }}</span>
          </div>
        </div>
      </div>
    </div>

    <div class="space24"></div>
  </div>
</div>
